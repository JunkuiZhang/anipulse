[database]
path = "/var/lib/anipulse/anipulse.db"

[bilibili]
# 这是项目自身的克制预算，不代表 Bilibili 官方安全线。
base_url = "https://api.bilibili.com"
min_request_interval_secs = 5
max_requests_per_day = 500
max_search_requests_per_check = 2
max_detail_requests_per_check = 3
request_timeout_secs = 15
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36 AniPulse/0.1"

[confirmation]
minimum_candidate_score = 60
detail_threshold_score = 35
consensus_uploaders = 2
max_duration_delta_secs = 180
max_publish_delta_secs = 7200
candidate_expire_secs = 259200
trusted_confirmed_count = 3

[polling]
far_interval_secs = 21600
two_day_interval_secs = 7200
half_day_interval_secs = 3600
release_interval_secs = 900
day_after_interval_secs = 1800
three_day_interval_secs = 7200
jitter_ratio = 0.1

[notification]
# 飞书自建应用凭证和私聊收件人只从环境变量读取：
# FEISHU_APP_ID=cli_...
# FEISHU_APP_SECRET=...
# FEISHU_RECEIVE_ID_TYPE=email（也支持 open_id、user_id、union_id）
# FEISHU_RECEIVE_ID=你的飞书账号邮箱
provider = "feishu"
channel = "feishu-private-anime"
notify_pending = false
# 开启后，无法自动确认时会发送飞书审核卡片，并跳转到鉴权网页。
request_timeout_secs = 15
review_grace_secs = 3600

[schedule]
# 自动排期使用 bangumi-data 的精确 broadcast，并用 Bangumi 章节日期校准停播/调档。
# 国内服务器可按 doc/cloudflare-worker.md 改成自己的 Worker 地址。
bangumi_data_url = "https://unpkg.com/bangumi-data@0.3/dist/data.json"
bangumi_api_base_url = "https://api.bgm.tv"
# 这里只选择 bangumi-data 里的排期元数据，服务器不会访问这些平台的网站。
preferred_site = "bilibili"
# preferred_site 没有具体时刻时，会比较以下可信来源：优先采用至少两个独立平台
# 在 2 小时内相互印证的最早档期；列表顺序只用于同时间决胜和无共识时回退。
stream_site_priority = ["danime", "abema", "gamer", "gamer_hk"]
# 即使旧配置仍在上面的优先列表中写了 U-NEXT，也会先被这里排除。
excluded_stream_sites = ["unext"]
# 网络先行/延后可能跨日或跨周；默认最多接受与 Bangumi 首集日期相差 14 天。
max_stream_offset_days = 14
# 默认目录时间不是明确网络来源，只允许很小的日期偏差，避免生成错误的精确时间。
max_catalog_offset_days = 1
sync_interval_secs = 86400
failure_retry_secs = 900
request_timeout_secs = 30
sync_batch_size = 20
# 按 Bangumi API 要求，把 your-bangumi-id 改为你的 Bangumi 用户名或稳定个人标识。
user_agent = "your-bangumi-id/AniPulse/0.1 (personal self-hosted)"

[scheduler]
tick_secs = 30
due_batch_size = 20
management_job_batch_size = 10

[web]
bind = "127.0.0.1:8080"
public_url = "https://anime.example.com"
# 相对路径以 systemd 的 WorkingDirectory=/var/lib/anipulse 为基准。
cover_cache_dir = "covers"
# 网页中所有时间统一转换到这个 IANA 时区。
timezone = "Asia/Shanghai"
trusted_proxy_cidrs = ["127.0.0.1/32", "::1/128"]
session_idle_secs = 7200
session_absolute_secs = 86400
session_renewal_secs = 1800
login_window_secs = 900
login_max_failures = 5
request_timeout_secs = 15
max_body_bytes = 65536
development_mode = false
dangerous_allow_public_bind = false
