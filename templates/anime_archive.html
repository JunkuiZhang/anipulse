{% extends "base.html" %}
{% block title %}归档 {{ title }} · AniPulse{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ARCHIVE COLLECTION</p><h1>看完并归档</h1><p class="page-description">归档不会删除收藏本身，但会压缩不再需要的运行数据。</p></div><a class="button" href="/anime/{{ id }}">取消</a></div>
<div class="alert">归档“{{ title }}”前会保存观看统计快照，再清理逐集候选、通知、检查任务、该番的 UP 信任和视频来源；全局信任不受影响。</div>
<form method="post" action="/anime/{{ id }}/archive" class="panel stack archive-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="nonce" value="{{ nonce }}">
  <label>本季总集数<input type="number" name="total_episodes" value="{{ suggested_total }}" min="1" max="10000" required></label>
  <div class="archive-memory-fields">
    <label>我的评分（1–10，可选）<input type="number" name="rating" min="1" max="10" inputmode="numeric" placeholder="例如 8"></label>
    <label>标签（可选）<input name="tags" maxlength="300" placeholder="例如 推荐、科幻、想重看"></label>
  </div>
  <label>一句话短评（可选）<input name="short_review" maxlength="160" placeholder="最想为这部作品留下的一句话"></label>
  <label>观后感（可选）<textarea name="summary" rows="7" maxlength="4000" placeholder="喜欢的角色、印象深刻的情节，或者看完后的想法。">{{ existing_summary }}</textarea></label>
  <label class="check"><input type="checkbox" name="confirm_watched" value="yes" required> 我已经实际看完本季，确认归档收藏</label>
  <button class="primary" type="submit">确认归档</button>
</form>
{% endblock %}
