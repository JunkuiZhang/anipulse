{% extends "base.html" %}
{% block title %}归档 {{ title }} · AniPulse{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ARCHIVE COLLECTION</p><h1>看完并归档</h1><p class="page-description">归档不会删除收藏本身，但会压缩不再需要的运行数据。</p></div><a class="button" href="/anime/{{ id }}">取消</a></div>
<div class="alert">归档“{{ title }}”后，将清理逐集候选、通知、检查任务、UP 信任和视频来源。封面、标题、别名、简介、总集数与归档时间会保留。</div>
<form method="post" action="/anime/{{ id }}/archive" class="panel stack archive-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="nonce" value="{{ nonce }}">
  <label>本季总集数<input type="number" name="total_episodes" value="{{ suggested_total }}" min="1" max="10000" required></label>
  <label>简介或观看记录（可选）<textarea name="summary" rows="7" maxlength="4000" placeholder="可以写作品简介、看完感想、喜欢的角色等。">{{ existing_summary }}</textarea></label>
  <label class="check"><input type="checkbox" name="confirm_watched" value="yes" required> 我已经实际看完本季，确认归档收藏</label>
  <button class="primary" type="submit">确认归档</button>
</form>
{% endblock %}
