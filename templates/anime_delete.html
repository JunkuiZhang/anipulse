{% extends "base.html" %}
{% block title %}删除 {{ title }} · AniPulse{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">DANGER ZONE</p><h1>永久删除追番</h1></div><a class="button" href="/anime/{{ id }}">取消</a></div>
<div class="alert">此操作会删除“{{ title }}”的 Episode、候选、通知和 UP 信任记录，只能通过数据库备份恢复。</div>
<section class="panel details"><dl><dt>Anime ID</dt><dd>{{ id }}</dd><dt>标题</dt><dd>{{ title }}</dd><dt>Bangumi</dt><dd>{{ bangumi }}</dd><dt>当前状态</dt><dd>已停用</dd></dl></section>
<form method="post" action="/anime/{{ id }}/delete" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="nonce" value="{{ nonce }}">
  <input type="hidden" name="updated_at" value="{{ updated_at }}">
  <label>输入完整标题以确认<input name="title" autocomplete="off" required></label>
  <button class="primary" type="submit">永久删除</button>
</form>
{% endblock %}
