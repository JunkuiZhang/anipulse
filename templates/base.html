<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AniPulse{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg?v=1" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v=light-5">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="AniPulse 首页"><span class="brand-mark"></span>AniPulse</a>
      <nav aria-label="主导航">
        <a href="/anime">追番</a>
        <a href="/candidates">候选</a>
        <a href="/rules">规则</a>
        <a href="/jobs">任务</a>
        <a href="/audit">审计</a>
        <a href="/settings/status">状态</a>
      </nav>
      <div class="account">
        <span class="account-name">{{ username }}</span>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="link-button" type="submit">退出</button>
        </form>
      </div>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
