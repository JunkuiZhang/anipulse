[package]
name = "anipulse"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
askama = "0.16"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "http1", "query", "tokio"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
hmac = "0.13"
hkdf = "0.13"
ipnet = { version = "2.12", features = ["serde"] }
md5 = "0.8"
rand = "0.10"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = [
    "form",
    "json",
    "query",
    "rustls",
] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "derive",
    "macros",
    "migrate",
] }
thiserror = "2.0"
tokio = { version = "1.47", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1.1"
tower-http = { version = "0.7", features = [
    "catch-panic",
    "limit",
    "request-id",
    "set-header",
    "timeout",
    "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
